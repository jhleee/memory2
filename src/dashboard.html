<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context Memory</title>
<style>
:root{color-scheme:light;--ink:#17242d;--muted:#62717a;--line:#dce4e7;--paper:#f4f7f6;--card:#fff;--teal:#176b62;--pale:#e8f3f0;--red:#a53b38}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#153b3c;color:#f5fbf9;padding:22px max(22px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:18px}header h1{font-size:20px;margin:0;letter-spacing:-.03em}header p{margin:3px 0 0;color:#bdd4cf;font-size:13px}.wrap{max-width:1160px;margin:24px auto;padding:0 20px}.bar,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}.bar{padding:15px;display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-bottom:16px}.panel{padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px}.panel h2{font-size:16px;margin:0 0 14px}.field{display:flex;flex-direction:column;gap:5px;min-width:120px;flex:1}.field label{font-size:12px;color:var(--muted);font-weight:650}input,textarea,select{font:inherit;color:var(--ink);border:1px solid #cbd6d9;border-radius:7px;padding:9px 10px;background:white;min-width:0}textarea{resize:vertical;min-height:84px}button{border:0;border-radius:7px;padding:10px 14px;font:600 14px inherit;background:var(--teal);color:white;cursor:pointer}button.secondary{background:var(--pale);color:#15534e}button.danger{background:#fff0ef;color:var(--red)}button:disabled{opacity:.55;cursor:wait}.status{font-size:13px;color:var(--muted);min-height:20px}.status.error{color:var(--red)}.memory{padding:14px 0;border-top:1px solid var(--line)}.memory:first-child{border-top:0;padding-top:0}.memory-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.kind{font-size:12px;color:var(--teal);font-weight:700}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.meta{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.tag{display:inline-block;background:#f0f3f3;border-radius:4px;padding:1px 6px;margin:2px 3px 2px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:7px 9px}.empty{color:var(--muted);padding:15px 0}.hidden{display:none}.split{display:flex;gap:8px;align-items:end}.stats{font-size:12px;color:var(--muted);margin-left:auto}.trace{margin-top:8px;background:#f6f8f8;padding:9px;border-radius:6px;font-size:12px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}header{align-items:start;flex-direction:column}.bar>*{min-width:100%}.stats{margin-left:0}}
</style></head><body>
<header><div><h1>Context Memory</h1><p>로컬 기억 저장소 · 검색과 출처 확인</p></div><span id="connection" class="status">연결되지 않음</span></header>
<main class="wrap">
<section class="bar"><div class="field" style="flex:2"><label for="token">접근 토큰</label><input id="token" type="password" autocomplete="off" placeholder="터미널에서 발급된 토큰"></div><button id="connect">연결</button><div class="field"><label for="space">Space</label><select id="space"><option value="">기존 Space 선택</option></select></div><div class="field"><label for="new-space">새 Space ID</label><input id="new-space" placeholder="새 저장 공간"></div><div class="stats" id="counts"></div></section>
<div class="grid"><div>
<section class="panel"><h2>기억 검색</h2><form id="search-form" class="split"><div class="field"><label for="query">검색어</label><input id="query" placeholder="사람, 사건, 내용"></div><div class="field"><label for="search-mode">검색 방식</label><select id="search-mode"><option value="lexical">어휘 검색</option><option value="hybrid">하이브리드</option><option value="decision">판단 제공자</option></select></div><button id="search" type="submit">검색</button></form><div id="retrieval-status" class="status" aria-live="polite"></div><div id="results" class="empty">토큰을 입력하고 연결하세요.</div></section>
<section class="panel"><h2>Timeline</h2><div class="split"><div class="field"><label for="entity">Entity ID (선택)</label><input id="entity" placeholder="Entity ID"></div><button class="secondary" id="timeline">불러오기</button></div><div id="timeline-results" class="empty">Space를 선택하세요.</div></section>
</div><div>
<section class="panel"><h2>검색 및 색인 상태</h2><div id="runtime-summary" class="meta">연결 후 Provider와 모델 정보를 확인할 수 있습니다.</div><div class="actions"><button id="index" class="secondary" type="button">임베딩 색인 시작</button><button id="retry-index" class="secondary" type="button">실패 작업 재시도</button><button id="refresh-status" class="secondary" type="button">상태 새로고침</button></div><div id="index-result" class="trace" aria-live="polite"></div></section>
<section class="panel"><h2>간단한 기억 기록</h2><div class="field"><label for="note">내용</label><textarea id="note" placeholder="기억할 내용을 입력하세요"></textarea></div><div class="field" style="margin-top:10px"><label for="source">출처 내용</label><input id="source" placeholder="이 기억의 원문 근거"></div><div class="field" style="margin-top:10px"><label for="kind">종류</label><input id="kind" value="note"></div><button id="record" style="margin-top:12px">기록</button></section>
<section class="panel"><h2>정정</h2><p class="meta">검색 결과에서 정정할 기억을 선택하면 원본 출처와 수정 시각을 사용합니다.</p><div class="field"><label for="correct-content">수정된 내용</label><textarea id="correct-content" placeholder="검색 결과의 정정 버튼을 누른 뒤 입력"></textarea></div><div class="field" style="margin-top:10px"><label for="correct-source">정정 근거</label><input id="correct-source" placeholder="정정의 출처 내용"></div><button id="correct" class="secondary" style="margin-top:12px" disabled>선택한 기억 정정</button><div id="detail" class="meta" style="margin-top:9px">선택된 기억 없음</div></section>
</div></div><div id="notice" class="status" role="status"></div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let selected=null;const text=(node,value)=>{node.textContent=value??''};
async function api(path,data,method='POST'){const token=$('token').value.trim();const response=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(method==='POST'?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});let body;try{body=await response.json()}catch{throw Error('서버 응답을 읽지 못했습니다')}if(!response.ok)throw Error(body.error||'요청 실패');return body}
function message(msg,error=false){text($('notice'),msg);$('notice').classList.toggle('error',error)}function activeSpace(){const space=$('new-space').value.trim()||$('space').value;if(!space)throw Error('Space를 선택하거나 새 Space ID를 입력하세요');return space}async function busy(button,work){if(button.disabled)return;button.disabled=true;try{await work()}finally{button.disabled=false}}
function traceSummary(t){const parts=[];if(t.matched_by?.length)parts.push('일치 방식 '+t.matched_by.join(', '));if(Number.isFinite(t.score))parts.push('순위 점수 '+t.score);const values={...(t.components||{})};for(const key of ['vector_cosine','decision_score'])if(t[key]!==undefined)values[key]=t[key];for(const [key,value] of Object.entries(values))if(typeof value==='number'||typeof value==='string')parts.push(key+' '+value);return parts.join(' · ')}
function renderItems(container,items,traces=[],sources=[]){container.replaceChildren();if(!items?.length){container.className='empty';text(container,'기억이 없습니다.');return}container.className='';for(const item of items){const card=document.createElement('article');card.className='memory';const top=document.createElement('div');top.className='memory-top';const title=document.createElement('span');title.className='kind';text(title,item.kind+' · '+item.lifecycle);top.append(title);const resolution=document.createElement('span');resolution.className='tag';text(resolution,item.resolution==='unresolved'?'미해결':'참조 해결');top.append(resolution);card.append(top);const body=document.createElement('div');body.className='body';text(body,item.content);card.append(body);if(item.data&&Object.keys(item.data).length){const data=document.createElement('div');data.className='trace';text(data,'구조화 데이터: '+JSON.stringify(item.data));card.append(data)}const meta=document.createElement('div');meta.className='meta';text(meta,'ID '+item.id+' · 수정 '+(item.updated_at||'')+' · 출처 '+(item.source_id||''));card.append(meta);const evidence=sources.find(s=>s.id===item.source_id);if(evidence){const source=document.createElement('div');source.className='trace';text(source,'근거 ('+evidence.source_type+'): '+evidence.content);card.append(source)}const trace=traces.find(t=>t.memory_id===item.id);if(trace){const why=document.createElement('div');why.className='trace';text(why,'검색 trace: '+traceSummary(trace));card.append(why)}const buttons=document.createElement('div');buttons.className='actions';const choose=document.createElement('button');choose.className='secondary';choose.textContent='정정 선택';choose.addEventListener('click',()=>{selected=item;$('correct-content').value=item.content;$('correct-source').value='정정: '+item.content;$('correct').disabled=false;text($('detail'),'선택 ID '+item.id+' · updated_at '+item.updated_at+' · evidence '+item.source_id)});buttons.append(choose);if(item.kind==='mention'){const suggest=document.createElement('button');suggest.className='secondary';suggest.textContent='Entity 후보 제안';suggest.addEventListener('click',()=>busy(suggest,async()=>{try{const response=await api('/api/suggest',{space_id:item.space_id,memory_id:item.id});showSuggestions(card,item,response);message(response.unresolved?'후보를 표시했습니다. 직접 확인 후 연결하세요.':'후보를 표시했습니다.')}catch(e){message(e.message,true)}}));buttons.append(suggest);const resolve=document.createElement('button');resolve.className='secondary';resolve.textContent='ID 직접 입력 후 연결';resolve.addEventListener('click',()=>busy(resolve,async()=>{const entity_id=prompt('연결할 Entity ID를 입력하세요');if(!entity_id)return;try{await api('/api/resolve',{space_id:item.space_id,mention_id:item.id,entity_id:entity_id.trim()});message('Mention을 연결했습니다. 원본 기억은 보존됩니다.');await search()}catch(e){message(e.message,true)}}));buttons.append(resolve)}const forget=document.createElement('button');forget.className='danger';forget.textContent='삭제';forget.addEventListener('click',()=>busy(forget,async()=>{if(!confirm('이 기억을 삭제할까요?'))return;try{await api('/api/forget',{space_id:item.space_id,memory_id:item.id});message('기억을 삭제했습니다.');await search()}catch(e){message(e.message,true)}}));buttons.append(forget);card.append(buttons);container.append(card)}}
function showSuggestions(card,item,response){const box=document.createElement('div');box.className='trace';const title=document.createElement('div');title.textContent=response.unresolved?'Mention은 미해결 상태입니다. 연결은 별도 확인이 필요합니다.':'후보 제안';box.append(title);for(const warning of response.warnings||[]){const row=document.createElement('div');row.textContent='안내: '+(typeof warning==='string'?warning:JSON.stringify(warning));box.append(row)}for(const candidate of response.suggestions||[]){const row=document.createElement('div');row.textContent='Entity '+candidate.id+' · 점수 '+candidate.score+' · '+candidate.reason;box.append(row);const accept=document.createElement('button');accept.type='button';accept.className='secondary';accept.textContent='이 후보를 Entity로 연결';accept.addEventListener('click',()=>busy(accept,async()=>{try{await api('/api/resolve',{space_id:item.space_id,mention_id:item.id,entity_id:candidate.id});message('선택한 후보에 연결했습니다.');await search()}catch(e){message(e.message,true)}}));box.append(accept)}if(!(response.suggestions||[]).length){const none=document.createElement('div');none.textContent='후보가 없습니다.';box.append(none)}card.append(box)}
function statusSummary(s){const providers=s.providers||{};const embedding=providers.embedding||s.embedding||{};const decision=providers.decision||s.decision||{};const jobs=s.index_jobs||s.jobs||s.job_counts||{};const parts=[];const add=(label,value)=>{if(typeof value==='string'&&value)parts.push(label+': '+value)};add('Provider',s.provider);add('모델',s.model);add('Embedding provider',embedding.provider||embedding.name||s.embedding_provider);add('Embedding model',embedding.model||s.embedding_model);add('Decision provider',decision.provider||decision.name||s.decision_provider);add('Decision model',decision.model||s.decision_model);add('검색 제공 방식',s.retrieval);const count=[];const counts={queued:jobs.queued??jobs.pending,processed:jobs.processed??jobs.completed,failed:jobs.failed};for(const key of Object.keys(counts))if(counts[key]!==undefined&&Number.isFinite(Number(counts[key])))count.push(key+' '+Number(counts[key]));if(count.length)parts.push('색인 작업 '+count.join(' · '));text($('runtime-summary'),parts.length?parts.join(' / '):'Provider·모델 정보가 아직 설정되지 않았습니다.')}
async function refreshStatus(){try{const s=await api('/api/status',null,'GET');statusSummary(s)}catch(e){text($('runtime-summary'),'상태 조회 실패: '+e.message)}}
async function connect(){try{const spaces=await api('/api/spaces',null,'GET');const select=$('space');select.replaceChildren();const empty=document.createElement('option');empty.value='';empty.textContent='기존 Space 선택';select.append(empty);for(const s of spaces){const option=document.createElement('option');option.value=s.id;option.textContent=s.id;select.append(option)}text($('connection'),'연결됨');text($('counts'),spaces.map(s=>s.id+': 기억 '+s.memories+' · Entity '+s.entities).join(' / '));message(spaces.length?'Space를 선택하세요.':'저장된 Space가 없습니다.');await refreshStatus()}catch(e){text($('connection'),'인증 실패');message(e.message,true)}}
async function search(){try{const space_id=activeSpace(),query=$('query').value.trim();const result=await api('/api/recall',{space_id,query,mode:$('search-mode').value,limit:30});renderItems($('results'),result.items,result.traces,result.sources);const retrieval=result.retrieval||{};const notes=[];if(retrieval.used_mode||retrieval.mode)notes.push('사용 방식: '+(retrieval.used_mode||retrieval.mode));if(retrieval.degraded||retrieval.fallback)notes.push('대체 검색 사용');const warnings=[...(retrieval.warnings||[]),...(result.warnings||[])];for(const w of warnings)notes.push(typeof w==='string'?w:JSON.stringify(w));text($('retrieval-status'),notes.join(' · '));message('검색 결과 '+result.items.length+'개');}catch(e){message(e.message,true)}}
async function timeline(){try{const result=await api('/api/timeline',{space_id:activeSpace(),entity_id:$('entity').value.trim()||undefined,limit:30});renderItems($('timeline-results'),result.items);message('Timeline 결과 '+result.items.length+'개');}catch(e){message(e.message,true)}}
async function runIndex(retry,button){await busy(button,async()=>{try{const result=await api('/api/index',{space_id:activeSpace(),retry});const counts=['queued','processed','failed'].filter(k=>result[k]!==undefined).map(k=>k+' '+result[k]);text($('index-result'),(retry?'재시도 요청':'색인 요청')+' · '+(counts.join(' · ')||JSON.stringify(result)));await refreshStatus()}catch(e){text($('index-result'),e.message);message(e.message,true)}})}
$('connect').addEventListener('click',()=>busy($('connect'),connect));$('search-form').addEventListener('submit',e=>{e.preventDefault();busy($('search'),search)});$('timeline').addEventListener('click',()=>busy($('timeline'),timeline));$('refresh-status').addEventListener('click',()=>busy($('refresh-status'),refreshStatus));$('index').addEventListener('click',()=>runIndex(false,$('index')));$('retry-index').addEventListener('click',()=>runIndex(true,$('retry-index')));
$('record').addEventListener('click',()=>busy($('record'),async()=>{try{const space_id=activeSpace(),content=$('note').value.trim();if(!content)throw Error('내용을 입력하세요');await api('/api/record',{space_id,evidence:{source_type:'manual',content:$('source').value.trim()||content},memories:[{kind:$('kind').value.trim()||'note',content,resolution:'resolved'}]});$('note').value='';$('new-space').value='';message('기록했습니다.');await connect();$('space').value=space_id;await search()}catch(e){message(e.message,true)}}));
$('correct').addEventListener('click',()=>busy($('correct'),async()=>{try{if(!selected)throw Error('기억을 선택하세요');const content=$('correct-content').value.trim();if(!content)throw Error('수정된 내용을 입력하세요');const replacement={kind:selected.kind,content,data:selected.data,resolution:selected.resolution,support:selected.support};for(const key of ['occurred_at','valid_from','valid_to'])if(selected[key])replacement[key]=selected[key];await api('/api/correct',{space_id:selected.space_id,memory_id:selected.id,expected_updated_at:selected.updated_at,replacement,evidence:{source_type:'manual_correction',content:$('correct-source').value.trim()||content}});selected=null;$('correct').disabled=true;text($('detail'),'선택된 기억 없음');message('정정했습니다.');await search()}catch(e){message(e.message,true)}}));
})();
</script></body></html>
